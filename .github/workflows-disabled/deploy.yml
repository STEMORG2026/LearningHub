name: Deploy to Cloudflare Pages (gated)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The CI workflow is the authoritative gate: its "Verify governance" job
    # runs the full suite (typecheck, unit coverage, build, and the entire
    # Playwright suite via test:a11y — core, accessibility, and visual
    # regression). Deploy only when it completes green on main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm turbo build --filter=@learninghub/shell

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy apps/shell/dist --project-name=learninghubstem --branch=main

      - name: Verify production deployment
        run: |
          URL="https://learninghubstem.pages.dev/"
          for i in $(seq 1 12); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL")"
            if [ "$CODE" = "200" ]; then
              echo "✅ Production responded 200 at $URL"
              exit 0
            fi
            echo "Production not ready yet (HTTP $CODE) — retry $i/12 in 10s..."
            sleep 10
          done
          echo "❌ Production did not return 200 after retries."
          exit 1