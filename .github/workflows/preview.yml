name: PR Preview URL

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-url:
    name: Post preview URL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve preview URL from Cloudflare Pages API
        id: url
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Must match deploy.yml's `--project-name`. This was `stem-tution` —
          # the pre-rebrand project, which no longer exists, so every preview URL
          # this posted pointed at a dead deployment.
          PROJECT="learning-hub-2026"
          # Cloudflare sanitizes branch names in the alias URL (e.g. / -> -).
          BRANCH_SAFE="${HEAD_REF//\//-}"
          FALLBACK_URL="https://${BRANCH_SAFE}.${PROJECT}.pages.dev"

          RESOLVED=""
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "Querying Cloudflare Pages API for deployments of branch '${HEAD_REF}'..."
            # Deployments are async (usually ~1-2 min), so poll for up to ~2 minutes.
            for i in $(seq 1 8); do
              DEPLOYMENTS="$(curl -sf --max-time 20 \
                "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJECT}/deployments?per_page=100" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" 2>/dev/null || echo '{"success":false}')"

              RESOLVED="$(echo "$DEPLOYMENTS" | jq -r \
                --arg b "$HEAD_REF" \
                '.result
                 | sort_by(.created_on)
                 | reverse
                 | .[]
                 | select(.deployment_trigger.metadata.branch == $b)
                 | .url
                 | select(. != null and . != "")' 2>/dev/null | head -1)"

              if [ -n "$RESOLVED" ]; then
                echo "Resolved preview URL from API: $RESOLVED"
                break
              fi
              echo "No deployment for '${HEAD_REF}' yet (attempt $i/8) — retrying in 15s..."
              sleep 15
            done
          else
            echo "CF_API_TOKEN/CF_ACCOUNT_ID secrets not configured."
          fi

          if [ -z "$RESOLVED" ]; then
            echo "No Cloudflare deployment found for this branch — trying the alias URL."
            RESOLVED="$FALLBACK_URL"
          fi

          # VERIFY BEFORE CLAIMING.
          # The previous version fell back to a *constructed* URL and reported
          # success without ever checking it. Every PR got a preview link that
          # returned 404 — a green check pointing at a dead page, which is worse
          # than an honest failure because it looks verified.
          CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$RESOLVED" 2>/dev/null || echo 000)"
          echo "Checked $RESOLVED -> HTTP $CODE"

          if [ "$CODE" = "200" ]; then
            {
              echo "url=$RESOLVED"
              echo "live=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "live=false"
              echo "checked=$RESOLVED"
              echo "code=$CODE"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Find existing comment
        id: find-comment
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Preview URL

      - name: Comment the live preview URL
        if: steps.url.outputs.live == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Preview URL: ${{ steps.url.outputs.url }}

            | Page | Link |
            |------|------|
            | Home | ${{ steps.url.outputs.url }}/ |
            | Classes | ${{ steps.url.outputs.url }}/classes.html |
            | Videos | ${{ steps.url.outputs.url }}/videos.html |
            | Learn | ${{ steps.url.outputs.url }}/learn.html |
            | About | ${{ steps.url.outputs.url }}/about.html |
            | Contact | ${{ steps.url.outputs.url }}/contact.html |
          edit-mode: replace

      - name: Comment that no preview is available
        if: steps.url.outputs.live != 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **No preview deployment available for this PR.**

            Checked `${{ steps.url.outputs.checked }}` → HTTP `${{ steps.url.outputs.code }}`.

            Nothing in this repository deploys previews — only `deploy.yml` deploys
            production (`--branch=main`). Preview deployments are expected to come
            from the Cloudflare Pages **git integration**, and it is currently
            producing none for any branch.

            This needs a human in the Cloudflare dashboard. See the archive plan's
            **W2.5/W2.6** items (token lacks `Pages: Edit`; git integration vs
            wrangler deploy conflict).
          edit-mode: replace

      # Fail AFTER commenting, so the reason is visible on the PR rather than
      # buried in a log nobody opens.
      - name: Fail if no live preview
        if: steps.url.outputs.live != 'true'
        run: |
          echo "::error::No live preview deployment for this branch."
          echo "Preview deployments come from the Cloudflare Pages git integration,"
          echo "which is currently producing none. This is a dashboard-side fix (W2.6)."
          exit 1
