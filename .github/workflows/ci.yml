name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify governance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: pnpm exec playwright install chromium
      # `lint:workflows` is part of the full gate tier, so actionlint must be on
      # PATH here — not only in the separate `Workflow lint` job. The gate fails
      # closed when the tool is missing in CI, by design.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          # Install OUTSIDE the working tree. The download script writes the
          # binary into $PWD, and a stray `actionlint` at the repo root is picked
          # up by generate-tree.mjs — which then fails the strict tree.txt check
          # in the very job that installed it. $RUNNER_TEMP is the right home.
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          cd "$RUNNER_TEMP/actionlint-bin"
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) "$ACTIONLINT_VERSION"
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Run governance gate
        run: pnpm verify-governance

  docs-sync:
    name: Documentation freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify generated docs are in sync
        run: |
          pnpm docs:sync
          # tree.txt used to carry a HEAD sha, which forced a one-line-drift
          # carve-out here. The header is now a constant, so every generated
          # file — tree.txt included — is checked strictly.
          git diff --exit-code
          REMAINING="$(git ls-files --others --exclude-standard)"
          if [ -n "$REMAINING" ]; then
            echo "❌ Untracked files remain after docs:sync:"
            echo "$REMAINING"
            exit 1
          fi
          echo "✅ Generated documentation is in sync."

  changeset-check:
    name: Changeset requirement check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check for changesets when package source changes
        run: |
          CHANGED_PKGS="$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^packages/[^/]+/src/' || true)"
          if [ -n "$CHANGED_PKGS" ]; then
            echo "📦 Package source changed:"
            echo "$CHANGED_PKGS"
            CHANGESETS="$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^\.changeset/.*\.md$' | grep -v 'README.md' | grep -v 'config.json' || true)"
            if [ -z "$CHANGESETS" ]; then
              echo "❌ No Changeset found in .changeset/."
              echo "Run 'pnpm changeset' to record release intent for package changes."
              exit 1
            fi
            echo "✅ Changeset(s) found:"
            echo "$CHANGESETS"
          else
            echo "ℹ️ No package source changes — changeset check skipped."
          fi

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
          else
            npx commitlint --last --verbose
          fi

  signed-tags:
    name: Verify signed tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify GPG signature on tags
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Verifying tag ${{ github.ref_name }}"
            if ! git verify-tag "${{ github.ref_name }}"; then
              echo "❌ Tag ${{ github.ref_name }} is not GPG-signed. Releases require signed tags."
              exit 1
            fi
            echo "✅ Tag ${{ github.ref_name }} is GPG-signed."
          else
            echo "Skipping — not a tag push"
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: node scripts/checks/audit-deps.cjs

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install actionlint
        env:
          # Pinned to the version the check was verified against locally, so CI
          # and a developer machine agree. Bump deliberately, not implicitly.
          ACTIONLINT_VERSION: 1.7.7
        run: |
          # Outside the working tree — see the note in the `verify` job. A stray
          # binary at the repo root leaks into tree.txt.
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          cd "$RUNNER_TEMP/actionlint-bin"
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) "$ACTIONLINT_VERSION"
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Lint workflow files
        run: node scripts/checks/lint-workflows.mjs

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium
      - name: Build shell and workspace deps
        run: pnpm turbo build --filter=@learninghub/shell
      - name: Resolve Chrome path
        run: |
          CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          echo "CHROME_PATH=${CHROME_PATH}" >> "$GITHUB_ENV"
      - name: Start preview server
        run: |
          (cd apps/shell && pnpm exec vite preview --port 4173 --strictPort >/tmp/preview.log 2>&1 &)
          sleep 4
          curl -sf http://localhost:4173/ -o /dev/null
      - name: Collect Lighthouse runs
        run: npx lhci collect --config=./lighthouserc.json --settings.chromePath="$CHROME_PATH"
      - name: Assert Lighthouse budgets
        run: npx lhci assert --config=./lighthouserc.json
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lhci-reports
          path: |
            lhci-reports/
            .lighthouseci/*.html
          if-no-files-found: ignore
