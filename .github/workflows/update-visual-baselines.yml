name: Update Visual Baselines

on:
  workflow_dispatch:
    inputs:
      commit-message:
        description: Commit message for the baseline update
        required: false
        default: 'test: refresh visual baselines from CI environment'

# NOTE: This workflow pushes with the repository GITHUB_TOKEN. Commits authored
# by `github-actions[bot]` do NOT re-trigger workflow runs (GitHub recursion
# guard), so after a baseline refresh push a follow-up commit from a normal
# identity (e.g. `git push --force-with-lease` an empty/no-op change) to get a
# fresh CI + smoke run that validates the new baselines.

permissions:
  contents: write

jobs:
  update-baselines:
    name: Regenerate visual baselines in CI environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Build shell and workspace deps
        run: pnpm turbo build --filter=@learninghub/shell

      - name: Regenerate visual baselines
        run: pnpm exec playwright test --config=playwright.config.ts e2e/visual-regression.spec.ts --update-snapshots

      - name: Commit updated baselines
        run: |
          if [ -z "$(git status --porcelain -- '**/*-chromium-linux.png' '**/__snapshots__/**')" ]; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "${{ inputs.commit-message || 'test: refresh visual baselines from CI environment' }}"
          git push origin HEAD:main