name: Update Visual Baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to push the refreshed baselines to
        required: false
        default: test/visual-baselines
      commit-message:
        description: Commit message for the baseline update
        required: false
        default: 'test: refresh visual baselines from CI environment'

# WHY THIS PUSHES A BRANCH INSTEAD OF `main`
# ------------------------------------------
# This workflow used to end with `git push origin HEAD:main`. That was written
# when `main` was unprotected. Branch protection now requires a PR, up-to-date
# status checks, and applies to admins — so that push is rejected, and the
# refresh silently stops working.
#
# It is also the wrong shape regardless of protection: a screenshot baseline is a
# claim about how the UI should look, and it should be reviewable like any other
# change rather than landing directly on `main`.
#
# So: regenerate in CI (where the rendering matches the CI runner — a local
# regeneration does NOT produce identical pixels), push to a branch, open a PR.
#
# NOTE: commits authored by `github-actions[bot]` do not re-trigger workflow runs
# (GitHub recursion guard), so the PR this opens will not have CI attached until
# a follow-up commit is pushed by a normal identity.

permissions:
  contents: write
  pull-requests: write

jobs:
  update-baselines:
    name: Regenerate visual baselines in CI environment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.18.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Build shell and workspace deps
        run: pnpm turbo build --filter=@learninghub/shell

      - name: Regenerate visual baselines
        run: pnpm exec playwright test --config=playwright.config.ts e2e/visual-regression.spec.ts --update-snapshots

      - name: Push refreshed baselines to a branch
        id: push
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
        run: |
          if [ -z "$(git status --porcelain -- '**/*-chromium-linux.png' '**/__snapshots__/**')" ]; then
            echo "No baseline changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"
          git add -A
          git commit -m "$COMMIT_MESSAGE"
          git push --force-with-lease origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open a pull request for the refreshed baselines
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          # Reuse an existing PR for this branch if one is already open.
          EXISTING="$(gh pr list --head "$TARGET_BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for $TARGET_BRANCH — baselines updated on it."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$TARGET_BRANCH" \
            --title "test: refresh visual baselines from CI" \
            --body "Regenerated by the \`Update Visual Baselines\` workflow **in the CI environment**.

          Local regeneration is not equivalent — font rendering differs between a developer machine and the runner, so baselines must be produced here.

          Review the image diffs before merging: approving this PR means accepting the current rendering as the new reference."
