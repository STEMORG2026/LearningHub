name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # License-free gitleaks scan (works on private repos).
      # Pinned image; `detect --no-git` scans the working tree and exits non-zero on findings.
      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            zricethezav/gitleaks:v8.30.1 \
            detect --source=/src --no-git --verbose --redact

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  trivy-source:
    name: Trivy source scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
