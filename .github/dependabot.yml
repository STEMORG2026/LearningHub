version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    labels:
      - "deps"
    commit-message:
      prefix: "chore(deps)"
      # `include: "scope"` must NOT be set: it appends a "(deps-dev)" suffix
      # AFTER the configured prefix for dev-only bumps, producing
      # "chore(deps-dev)(deps-dev): …" (observed 2026-10-21 after PR #108's
      # prefix-development fix — the suffix, not the prefix, was the original
      # culprit). Without include, dev-only bumps come out as
      # "chore(deps-dev): …" — a real conventional scope that passes the
      # commitlint scope-enum gate.
      prefix-development: "chore(deps-dev)"
    groups:
      eslint:
        patterns:
          - "eslint*"
          - "@eslint*"
          - "@typescript-eslint/*"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@playwright/test"
          - "playwright"
          - "@axe-core/*"
          - "axe-core"
      build:
        patterns:
          - "turbo"
          - "vite"
          - "@vitejs/*"
      linting:
        patterns:
          - "commitlint"
          - "@commitlint/*"
          - "madge"
          - "dependency-cruiser"
      changesets:
        patterns:
          - "@changesets/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "ci"
    commit-message:
      prefix: "chore(ci)"
      # include: "scope" deliberately unset — see the npm section comment.
    groups:
      actions:
        patterns:
          - "actions/*"
