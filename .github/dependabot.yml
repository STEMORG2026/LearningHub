version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    labels:
      - "deps"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      eslint:
        patterns:
          - "eslint*"
          - "@eslint*"
          - "@typescript-eslint/*"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@playwright/test"
          - "playwright"
          - "@axe-core/*"
          - "axe-core"
      build:
        patterns:
          - "turbo"
          - "vite"
          - "@vitejs/*"
      linting:
        patterns:
          - "commitlint"
          - "@commitlint/*"
          - "madge"
          - "dependency-cruiser"
      changesets:
        patterns:
          - "@changesets/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "ci"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      actions:
        patterns:
          - "actions/*"
