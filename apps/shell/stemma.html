<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore canonical STEMMA knowledge entities across Biology, Chemistry, Physics, Mathematics, Computer Science, and Engineering." />
  <meta name="theme-color" content="#1a1d29" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="LearningHub" />
  <meta property="og:title" content="STEMMA Knowledge Explorer | LearningHub" />
  <title>STEMMA Knowledge Explorer | LearningHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/main.css" />
  <style>
    .domain-filters { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 2rem; justify-content: center; }
    .domain-filter-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); color: #e0e0e0; padding: 0.5rem 1.2rem; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
    .domain-filter-btn.active, .domain-filter-btn:hover { background: #00d4ff; color: #0b0f19; border-color: #00d4ff; }
  </style>
</head>
<body>
  <canvas id="stemBackgroundCanvas" aria-hidden="true"></canvas>
  <div id="scroll-progress"></div>
  <site-header active="stemma" modal></site-header>

  <main>
    <div class="page-hero reveal-on-scroll">
      <span class="section-tag"><icon-bolt name="bolt"></icon-bolt> Open STEM Knowledge Substrate</span>
      <h1>STEMMA <span class="accent">Knowledge Explorer</span></h1>
      <p class="page-sub">Structured facts, mathematical definitions, misconceptions, and relationships imported directly from the STEMMA export repository.</p>
      <div style="margin-top: 1rem; color: #00d4ff; font-weight: 700;" id="entityCount">Loading entities...</div>
    </div>

    <section>
      <div class="domain-filters reveal-on-scroll">
        <button type="button" class="domain-filter-btn active" data-domain="all">All Domains</button>
        <button type="button" class="domain-filter-btn" data-domain="physics">Physics</button>
        <button type="button" class="domain-filter-btn" data-domain="biology">Biology</button>
        <button type="button" class="domain-filter-btn" data-domain="chemistry">Chemistry</button>
        <button type="button" class="domain-filter-btn" data-domain="mathematics">Mathematics</button>
        <button type="button" class="domain-filter-btn" data-domain="computer_science">Computer Science</button>
      </div>

      <div id="stemmaMount" style="max-width:900px;margin:0 auto;" class="reveal-on-scroll"></div>
    </section>
  </main>

  <site-footer></site-footer>
  <enroll-modal></enroll-modal>
  <professor-j-widget></professor-j-widget>

  <script type="module" src="/src/pages/stemma.ts"></script>
</body>
</html>
