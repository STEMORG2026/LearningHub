<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Page not found — LearningHub Pokhara." />
  <meta name="robots" content="noindex" />
  <title>Page Not Found | LearningHub</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: radial-gradient(circle at 50% 0%, #0d143a 0%, #070b24 45%, #05081c 100%);
      color: #f8fafc;
      padding: 2rem;
    }
    .card {
      text-align: center;
      max-width: 520px;
      padding: 3rem 2rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
    }
    .code {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(90deg, #00d4ff, #00e8a2);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 { margin: 1rem 0 0.5rem; font-size: 1.5rem; }
    p { color: #94a3b8; margin: 0 0 1.5rem; }
    .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    a.btn {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      background: linear-gradient(90deg, #00d4ff, #00e8a2);
      color: #05081c;
    }
    a.btn.secondary { background: rgba(255, 255, 255, 0.06); color: #f8fafc; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <div class="actions">
      <a class="btn" href="/">Back to Home</a>
      <a class="btn secondary" href="/contact.html">Contact Us</a>
    </div>
  </main>
</body>
</html>
