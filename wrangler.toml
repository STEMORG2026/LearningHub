# Cloudflare Pages configuration for LearningHub
# Docs: https://developers.cloudflare.com/pages/
#
# Deploying is handled by the Cloudflare Pages GitHub integration
# (Dashboard -> Workers & Pages -> learninghubstem -> Builds & deployments).
# The build command and output dir are configured in the dashboard
# (pages projects do not support a [build] section in wrangler.toml).

name = "learning-hub-2026"
compatibility_date = "2026-08-20"

pages_build_output_dir = "apps/shell/dist"
